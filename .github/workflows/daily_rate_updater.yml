name: Daily Construction Material Rates Updater

on:
  schedule:
    # 02:30 UTC = 08:00 AM IST (Indian Standard Time is UTC + 5:30)
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in Dry-Run mode (harvest rates without writing to PostgreSQL)'
        required: false
        type: boolean
        default: false
      target_date:
        description: 'Target Date for historical backfill (YYYY-MM-DD, defaults to current date)'
        required: false
        type: string
        default: ''

jobs:
  update-rates:
    name: Scrape & Upsert Material Rates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/scrapers/material_rates/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/scrapers/material_rates/requirements.txt

      - name: Execute Daily Scraper Pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ inputs.target_date }}" ]; then
            ARGS="$ARGS --date ${{ inputs.target_date }}"
          fi

          echo "Running pipeline with args: $ARGS"
          python scripts/scrapers/material_rates/scraper.py $ARGS

      - name: Record Execution Summary in GitHub UI
        if: always()
        run: |
          echo "### 🏗️ Sukoon Material Rates Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Execution Time**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status == 'success' && '✅ Completed Successfully' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY
