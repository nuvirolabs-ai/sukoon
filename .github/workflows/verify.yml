name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sukoon_s02_test_ci
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sukoon_s02_test_ci
      BETTER_AUTH_SECRET: ci-only-sukoon-secret-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3100
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
