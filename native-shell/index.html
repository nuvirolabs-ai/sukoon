<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sukoon</title>
    <style>
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #f7f3eb; color: #202521; font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 32px; }
      main { max-width: 28rem; text-align: center; }
      h1 { font-family: Georgia, serif; font-weight: 500; letter-spacing: 0.08em; }
      p { line-height: 1.5; color: #6b7280; }
    </style>
  </head>
  <body>
    <main>
      <h1>SUKOON</h1>
      <p>This Android shell is a client. Configure <code>SUKOON_ANDROID_SERVER_URL</code> in <code>.env.android.local</code>, then run <code>npm run android:sync</code>. The app does not contain the Sukoon database or private files.</p>
    </main>
  </body>
</html>
